name: Deploy

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/slxxxr/aureus-api:latest
            ghcr.io/slxxxr/aureus-api:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/slxxxr/aureus-api:cache
          cache-to: type=registry,ref=ghcr.io/slxxxr/aureus-api:cache,mode=max

      - name: Build and push Caddy image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/slxxxr/aureus-caddy:latest
            ghcr.io/slxxxr/aureus-caddy:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/slxxxr/aureus-caddy:cache
          cache-to: type=registry,ref=ghcr.io/slxxxr/aureus-caddy:cache,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      packages: write
    steps:
      - name: Setup SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o BatchMode=yes aureus@${{ secrets.SSH_HOST }} << 'ENDSSH'
          set -eo pipefail
          cd Aureus
          PREV_SHA=$(git rev-parse HEAD)
          echo "$PREV_SHA" > ~/.deploy_rollback_sha
          git pull
          docker tag ghcr.io/slxxxr/aureus-api:latest ghcr.io/slxxxr/aureus-api:rollback 2>/dev/null || true
          docker tag ghcr.io/slxxxr/aureus-caddy:latest ghcr.io/slxxxr/aureus-caddy:rollback 2>/dev/null || true
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          ENDSSH

      - name: Health check
        # 18 × 10s = 180s — covers docker healthcheck worst case:
        # start_period (30s) + retries 6 × interval (10s) = 90s, doubled for migrations
        run: |
          echo "Waiting for service to become healthy..."
          for i in $(seq 1 18); do
            sleep 10
            if curl -sf --max-time 5 https://aureus.life/health; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Attempt $i/18 failed"
          done
          echo "Health check timed out"
          exit 1

      - name: Cleanup old image versions
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in aureus-api aureus-caddy; do
            gh api "/user/packages/container/${pkg}/versions" --paginate \
              | jq '.[3:][].id' \
              | xargs -I{} gh api --method DELETE "/user/packages/container/${pkg}/versions/{}" || true
          done

      - name: Rollback
        if: failure()
        run: |
          ssh -o BatchMode=yes aureus@${{ secrets.SSH_HOST }} << 'ENDSSH'
          set -eo pipefail
          cd Aureus
          echo "Rolling back..."
          git reset --hard "$(cat ~/.deploy_rollback_sha)"
          docker tag ghcr.io/slxxxr/aureus-api:rollback ghcr.io/slxxxr/aureus-api:latest
          docker tag ghcr.io/slxxxr/aureus-caddy:rollback ghcr.io/slxxxr/aureus-caddy:latest
          docker compose -f docker-compose.prod.yml up -d
          ENDSSH
